<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Conta</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body class="login_body">

    <div class="fundoLoginECadastro"></div>

    <header>
        <div class="header">

            <div class="logo">
                <a href="">
                    <img onclick="window.location.href='http:index.html'" src="./LogoAmonia.png">
                </a>
            </div>

            <div class="botoes">
                <button class="nav_botao"
                    onclick="window.location.href='http:index.html'">
                    Página inicial
                </button>
            </div>

        </div>
    </header>


    <div class="login_box">

        <div class="login_container" id="login_container"></div>

    </div>


    <script>

        let container = `

            <h1 style="
                text-align: center;
                font-size: 20px;
                margin: 5px 0;
                color: #1f2937;
            ">
                Nova Conta
            </h1>

            <p style="
                text-align: center;
                font-size: 13px;
                color: #77736e;
                margin: 0 0 20px 0;
            ">
                Cadastre seu perfil
            </p>


            <h2>EMAIL</h2>

            <input
                type="text"
                placeholder="Digite seu email"
                id="input_cadastro">


            <h2>SENHA</h2>

            <input
                type="password"
                placeholder="Crie uma senha forte"
                id="input_criesenha">


            <h2>CONFIRMAR SENHA</h2>

            <input
                type="password"
                placeholder="Repita a senha criada"
                id="input_repita">


            <button
                class="btn_entrar"
                onclick="Criar()">
                CADASTRAR
            </button>


            <div
                id="div_mensagem">
            </div>


            <p style="
                text-align: center;
                font-size: 11px;
                color: #77736e;
                margin-top: 12px;
            ">
                Já possui uma conta?
                <a
                    href="http:paginaLogin.html"
                    style="
                        color: #477ca5;
                        font-weight: bold;
                    ">
                    Fazer login
                </a>
            </p>
        `

        login_container.innerHTML = container


        function irLogin() {

            window.location.href = "http:paginaLogin.html";

        }


        function Criar() {

            let email = input_cadastro.value
            let senha = input_criesenha.value
            let repita = input_repita.value


            if (email == '') {

                div_mensagem.innerHTML =
                    `<b style="color: red;">Insira um email</b>`

            } else if (senha == '') {

                div_mensagem.innerHTML =
                    `<b style="color: red;">Insira uma senha</b>`

            } else if (senha == senha.toLowerCase()) {

                div_mensagem.innerHTML =
                    `<b style="color: red;">A senha deve conter letras maiusculas</b>`

            } else if (senha == senha.toUpperCase()) {

                div_mensagem.innerHTML =
                    `<b style="color: red;">A senha deve conter letras minusculas</b>`

            } else if (senha.length < 8) {

                div_mensagem.innerHTML =
                    `<b style="color: red;">A senha deve conter mais de 7 caracteres</b>`

            } else if (repita != senha) {

                div_mensagem.innerHTML =
                    `<b style="color: red;">Senha não está igual</b> `

            } else if (!email.endsWith('.com') && !email.includes('@')) {

                div_mensagem.innerHTML =
                    `<b style="color: red;">Insira um email válido</b>`

            } else {

                container = `
                
                    <p style="
                        text-align: center;
                        color: #1f2937;
                        font-size: 14px;
                    ">
                        Seu usuário foi criado ✅
                    </p>

                    <button
                        class="btn_entrar"
                        onclick="irLogin()">
                        IR PARA LOGIN
                    </button>

                `

                login_container.innerHTML = container

            }

        }

    </script>

</body>

</html>
