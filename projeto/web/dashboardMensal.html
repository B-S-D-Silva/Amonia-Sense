<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amônia Sense</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body style="display: flex; flex-direction: column;">
    
    <h1 style="color: #1d2d3e;">Relatório Mensal de Monitoramento</h1>
    <h3 style="color: #1d2d3e;">AmoniaSense - Monitoramento de Amônia</h3>
    <span>Relatório do mês</span>
    <select id="select_mes">
        <option value="1">Janeiro</option>
        <option value="2">Fevereiro</option>
        <option value="3">Março</option>
        <option value="4">Abril</option>
        <option value="5">Maio</option>
        <option value="6">Junho</option>
        <option value="7">Julho</option>
        <option value="8">Agosto</option>
        <option value="9">Setembro</option>
        <option value="10">Outubro</option>
        <option value="11">Novembro</option>
        <option value="12">Dezembro</option>
    </select>
    <div>
        <canvas id="myChart"></canvas>
    </div>
    <div class="chart-container" style="position: relative; height:20vh; width:20vw">
        <canvas id="chart"></canvas>
    </div>
</body>

</html>
<script>
    const ctx = document.getElementById('myChart');
    let mes = select_mes.value

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: [' Dia 01', 'Dia 05', 'Dia 10', 'Dia 15', 'Dia 20', 'Dia 25', 'Dia 30'],
            datasets: [{
                label: 'PPM',
                data: [12, 0, 0, 0, 15, 0],
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
</script>
