<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entre</title>
    <link rel="stylesheet" href="../web\css\style-login-e-cadastro.css">

</head>

<body class="login_body">
    <div class="fundoLoginECadastro"></div>
    <header class="topbar">
        <div class="nav-shell">
            <div class="brand" onclick="window.location.href='../index.html'">
                <img class="brand-logo" src="./img/logo-transparente.png" alt="AmoniaSense">
            </div>
            <nav class="nav-links">
                <a href="./index.html">Home</a>
                <a href="./pagina-login.html">Login</a>
                <a href="./pagina-cadastro.html">Cadastro</a>
            </nav>
        </div>
    </header>
    
    <div class="login_box">
        <div class="login_container">

        <h1>Acesse amonia sense</h1>

        <p>Entre com sua conta</p>

        <h2>Email</h2>

        <input type="text" placeholder="Usuário" id="input_login">
        <input type="password" placeholder="Senha" id="input_senha">

        <button class="btn_entrar" onclick="Entrar()">Entrar</button>
        <button class="btn_cadastro" onclick="window.location.href='http:pagina-cadastro.html'">Criar conta</button>

        <div id="div_mensagem"></div>

    </div>
    </div>


    <script>

        function Entrar() {
            let login = input_login.value
            let senha = input_senha.value

            if (login == 'Kaua@gmail.com' && senha == '1234') {

                window.location.href = "http:dash.html"

            } else {
                div_mensagem.innerHTML = `Usuario Invalido`
            }


        }


    </script>

</body>
